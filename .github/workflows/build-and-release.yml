name: Build & Package Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # 1. LINUX BUILD (Standalone Binary, Snap & Deb)
  # -------------------------------------------------------------
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (GTK3 & Packaging Tools)
        run: |
          sudo apt update
          sudo apt install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 libgirepository1.0-dev snapd dpkg zip

      - name: Install Python Dependencies & PyInstaller
        run: |
          pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Build Linux Standalone Binary
        run: |
          pyinstaller --clean agy_helper.spec

      - name: Archive Linux Binary
        run: |
          cd dist
          tar -czvf AgyHelper-Linux-x86_64.tar.gz AgyHelper
          cd ..

      - name: Build Debian Package (.deb)
        run: |
          mkdir -p /tmp/pkg_deb/DEBIAN
          mkdir -p /tmp/pkg_deb/usr/bin
          mkdir -p /tmp/pkg_deb/usr/share/applications
          mkdir -p /tmp/pkg_deb/usr/share/icons/hicolor/128x128/apps

          cat << 'EOF' > /tmp/pkg_deb/DEBIAN/control
          Package: agy-helper
          Version: 1.0.0
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Agy Helper Contributors <contributors@agy-helper.open>
          Description: Friendly desktop companion and 1-click IT troubleshooter
           Agy Helper is a friendly, accessible desktop companion and 1-click IT troubleshooter
           powered by Google AGY and Gemini AI.
          EOF

          cp dist/AgyHelper /tmp/pkg_deb/usr/bin/agy-helper
          chmod 755 /tmp/pkg_deb/usr/bin/agy-helper
          cp assets/icon.png /tmp/pkg_deb/usr/share/icons/hicolor/128x128/apps/agy-helper.png

          cat << 'EOF' > /tmp/pkg_deb/usr/share/applications/agy-helper.desktop
          [Desktop Entry]
          Name=Agy Helper
          Comment=Friendly Desktop Helper & IT Troubleshooter
          Exec=/usr/bin/agy-helper --open-window
          Icon=agy-helper
          Terminal=false
          Type=Application
          Categories=Utility;System;
          EOF

          dpkg-deb --build --root-owner-group /tmp/pkg_deb dist/agy-helper_1.0.0_amd64.deb

      - name: Build Snap Package (.snap)
        run: |
          mkdir -p /tmp/pkg_snap/meta/gui
          cp assets/icon.png /tmp/pkg_snap/meta/gui/icon.png
          cp dist/AgyHelper /tmp/pkg_snap/AgyHelper
          chmod +x /tmp/pkg_snap/AgyHelper

          cat << 'EOF' > /tmp/pkg_snap/meta/snap.yaml
          name: agy-helper
          version: '1.0.0'
          summary: Agy IT Companion Desktop Helper
          description: |
            Friendly, stress-free desktop companion and 1-click IT troubleshooter.
          architectures:
            - amd64
          base: core24
          grade: stable
          confinement: classic
          apps:
            agy-helper:
              command: AgyHelper
          EOF

          cat << 'EOF' > /tmp/pkg_snap/meta/gui/agy-helper.desktop
          [Desktop Entry]
          Name=Agy Helper
          Comment=Friendly Desktop Helper & IT Troubleshooter
          Exec=agy-helper
          Icon=${SNAP}/meta/gui/icon.png
          Terminal=false
          Type=Application
          Categories=Utility;System;
          EOF

          snap pack /tmp/pkg_snap dist/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AgyHelper-Linux
          path: |
            dist/AgyHelper-Linux-x86_64.tar.gz
            dist/agy-helper_1.0.0_amd64.deb
            dist/agy-helper_*.snap

  # -------------------------------------------------------------
  # 2. WINDOWS BUILD (.exe via MSYS2 / MinGW GTK3)
  # -------------------------------------------------------------
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up MSYS2 with GTK3 & Python
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-gobject
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-adwaita-icon-theme
            mingw-w64-x86_64-gcc
            zip

      - name: Build Windows Executable
        shell: msys2 {0}
        run: |
          python3 -m pip install pyinstaller pillow
          pyinstaller --clean agy_helper.spec
          cd dist
          zip -r AgyHelper-Windows-x64.zip AgyHelper.exe || true

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AgyHelper-Windows
          path: |
            dist/AgyHelper.exe
            dist/AgyHelper-Windows-x64.zip

  # -------------------------------------------------------------
  # 3. macOS BUILD (.app & .dmg)
  # -------------------------------------------------------------
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install GTK3 and Python Dependencies
        run: |
          brew install gtk+3 pygobject3 adwaita-icon-theme create-dmg || true
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller pillow

      - name: Build macOS App Bundle
        run: |
          pyinstaller --clean \
            --windowed \
            --name "AgyHelper" \
            --icon "assets/icon.png" \
            --add-data "assets:assets" \
            main.py

      - name: Package into DMG
        run: |
          if command -v create-dmg &> /dev/null; then
            create-dmg \
              --volname "Agy Helper" \
              --window-pos 200 120 \
              --window-size 600 400 \
              --icon-size 100 \
              --icon "AgyHelper.app" 175 190 \
              --app-drop-link 425 190 \
              "dist/AgyHelper-macOS.dmg" \
              "dist/AgyHelper.app" || true
          fi
          if [ ! -f "dist/AgyHelper-macOS.dmg" ]; then
            hdiutil create -volname "AgyHelper" -srcfolder "dist/AgyHelper.app" -ov -format UDZO "dist/AgyHelper-macOS.dmg"
          fi

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgyHelper-macOS
          path: dist/AgyHelper-macOS.dmg

  # -------------------------------------------------------------
  # 4. FLATPAK BUILD (Universal Linux Bundle)
  # -------------------------------------------------------------
  build-flatpak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flatpak Builder
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: AgyHelper.flatpak
          manifest-path: flatpak/org.sectoroneventures.AgyHelper.yml
          run-tests: false

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgyHelper-Flatpak
          path: AgyHelper.flatpak

  # -------------------------------------------------------------
  # 5. CREATE GITHUB RELEASE (On Tags or Push to Main)
  # -------------------------------------------------------------
  release:
    needs: [build-linux, build-windows, build-macos, build-flatpak]
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: AgyHelper-*
          path: release/
          merge-multiple: true

      - name: List Release Files
        run: ls -la release/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: "Agy Helper ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }} — Multi-Platform Release"
          files: release/*
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
